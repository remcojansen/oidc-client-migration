# Machine-to-machine service account: no user, no browser redirect, client_credentials only.
# Confidential client authenticating with a shared secret over a private network.
annotations:
  owner_email: billing-platform@example.com
  owner_channel: "#billing-platform"
  owner_security_group: ad-grp-billing-platform

client:
  client_id: billing-batch-service
  client_name: Example Billing Batch Service
  description: Nightly batch job that reconciles invoices via internal APIs. No interactive users.
  grant_types:
    - client_credentials
  token_endpoint_auth_method: client_secret_basic
  scopes:
    - billing:invoices:read
    - billing:invoices:write
  application_type: web

extensions:
  enabled: true
  access_token_format: jwt
  access_token_lifetime_seconds: 900

secrets:
  encrypted_secret: "enc:v1:REPLACE_WITH_VAULT_REFERENCE"
