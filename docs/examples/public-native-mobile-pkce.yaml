# Native mobile app (iOS/Android) using the authorization code flow with PKCE.
# Public client: no client secret, PKCE is mandatory since the app cannot keep a secret.

annotations:
  owner_email: mobile-team@example.com
  owner_channel: "#mobile-platform"
  owner_security_group: ad-grp-mobile-platform

client:
  client_id: com.example.mobileapp
  client_name: Example Mobile App (iOS/Android)
  description: Native mobile client for the Example consumer app.
  enabled: true
  application_type: native
  token_endpoint_auth_method: none
  grant_types:
  - authorization_code
  - refresh_token
  response_types:
  - code
  redirect_uris:
  - com.example.mobileapp://callback
  - https://app.example.com/mobile/callback
  scopes:
  - openid
  - profile
  - email
  - offline_access
  pkce_required: true
  access_token_format: jwt
  access_token_lifetime_seconds: 300
  rotate_refresh_tokens: true
  offline_session_max_lifetime_seconds: 2592000
  offline_session_idle_timeout_seconds: 1209600
  subject_type: public
  id_token_signed_response_alg: RS256
  contacts:
  - mobile-team@example.com
